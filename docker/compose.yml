# The two systems of the talk: PostgreSQL (source of truth) and ClickHouse (the sidekick).
# Normally started through scripts/setup.sh (MODE=docker), which also picks free host ports if 5432 / 9000 / 8123 are taken
# and writes PG_ADDR_FROM_CH. By hand:
#   docker compose --env-file .env -f docker/compose.yml up -d --wait
# Inside this compose network ClickHouse reaches PostgreSQL as postgres:5432 (container port, whatever PG_PORT on the host is).
# host.docker.internal points at the host, for the mixed setup "ClickHouse in Docker, PostgreSQL local".
name: pg-clickhouse-sidekick
services:
  postgres:
    container_name: pgch-postgres
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-beer}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    container_name: pgch-clickhouse
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    environment:
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-beer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CH_PORT:-9000}:9000"
      - "${CH_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  chdata:
