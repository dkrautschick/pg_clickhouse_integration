# The two systems of the talk: PostgreSQL (source of truth) and ClickHouse (the sidekick).
#   docker compose --env-file .env -f docker/compose.yml up -d
# Inside this compose network ClickHouse reaches PostgreSQL as postgres:5432 -> set PG_ADDR_FROM_CH=postgres:5432.
name: pg-clickhouse-sidekick
services:
  postgres:
    image: ${PG_IMAGE:-postgres:18}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-beer}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  clickhouse:
    image: ${CH_IMAGE:-clickhouse/clickhouse-server:latest}
    environment:
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-beer}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CH_PORT:-9000}:9000"
      - "${CH_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  chdata:
